[package]
name = "solc"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "solc"
path = "src/main.rs"

[dependencies]
thiserror.workspace = true
miette.workspace = true
lib = { path = "../lib", package = "solc-lib" }

clap = { version = "4", default-features = false, features = [
  "std",
  "derive",
  "help",
] }
tracing-tree = "0.4.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing = "0.1.44"
